<div
  id="toast"
  class="flex items-center w-full max-w-xs p-2 mb-4 text-gray-700 bg-white rounded-lg shadow-lg"
  role="alert"
>
  <div
    class="inline-flex items-center justify-center shrink-0 w-8 h-8 rounded-lg"
    [ngClass]="{
      'bg-green-100 text-green-700': toastType === 'Success',
      'bg-orange-100 text-orange-700': toastType === 'Warning',
      'bg-red-100 text-red-700': toastType === 'Danger'
    }"
  >
    <img src="{{ icon }}" class="w-5 h-5" />
  </div>
  <div class="ms-3 text-xs font-normal">{{ message }}</div>
  <button
    type="button"
    class="ms-2 -my-2 bg-white text-gray-400 hover:text-gray-900 rounded-lg focus:ring-2 focus:ring-gray-300 p-2 hover:bg-gray-100 inline-flex items-center justify-center h-8 w-8 dark:text-gray-500 dark:hover:text-white dark:bg-gray-800 dark:hover:bg-gray-700"
    data-dismiss-target="#toast"
    aria-label="Close"
    (click)="handleClose()"
  >
    <span class="sr-only">Close</span>
    <svg
      class="w-3 h-3"
      aria-hidden="true"
      xmlns="http://www.w3.org/2000/svg"
      fill="none"
      viewBox="0 0 14 14"
    >
      <path
        stroke="currentColor"
        stroke-linecap="round"
        stroke-linejoin="round"
        stroke-width="2"
        d="m1 1 6 6m0 0 6 6M7 7l6-6M7 7l-6 6"
      />
    </svg>
  </button>
</div>
